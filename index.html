<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYRA - The Sky Talks</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="skyra.css">
    <style>
        /* Landing Page Specific */
        body {
            /* Override base for landing page sky gradient */
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            transition: background 1s ease;
        }
        
        body.night-mode {
            background: linear-gradient(to bottom, #02050a, #050a14);
        }

        /* Top Bar */
        .top-bar {
            position: absolute;
            top: 40px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .day-night-toggle {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .day-night-toggle:hover { background: rgba(255, 255, 255, 0.2); }

        /* Scene (Plane + Clouds) */
        .scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .plane-container {
            position: relative;
            z-index: 30;
            transform: translateY(-10vh);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(-10vh) translateX(0); }
            50% { transform: translateY(calc(-10vh - 15px)) translateX(5px); }
        }

        /* Clouds */
        .cloud-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none;
        }
        .cloud {
            position: absolute;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100"><path fill="rgba(255,255,255,0.4)" d="M50,80 A30,30 0 0,1 50,20 A40,40 0 0,1 130,20 A30,30 0 0,1 170,50 A30,30 0 0,1 150,100 Z"/></svg>') no-repeat;
            background-size: contain;
            opacity: 0.6;
            transition: opacity 1s, filter 1s;
        }
        
        body.night-mode .cloud {
            filter: brightness(0.2) contrast(1.5);
            opacity: 0.8;
        }

        .cloud1 { width: 800px; height: 400px; top: 40%; left: -200px; animation: drift 40s linear infinite; }
        .cloud2 { width: 600px; height: 300px; top: 50%; right: -100px; animation: drift 30s linear infinite reverse; opacity: 0.4; }
        .cloud3 { width: 1000px; height: 500px; top: 60%; left: -10%; animation: drift 50s linear infinite; opacity: 0.8; }

        @keyframes drift {
            from { transform: translateX(0); }
            to { transform: translateX(200px); }
        }

        /* Content Area */
        .content-bottom {
            position: absolute;
            bottom: 60px;
            left: 60px;
            right: 60px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .hero-left {
            max-width: 600px;
        }

        .badge-ai {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .tagline {
            font-size: 48px;
            line-height: 1.2;
            color: white;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .stats-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 40px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 32px;
        }
        
        .stat-item { display: flex; flex-direction: column; }
        .stat-val { font-size: 36px; font-weight: 400; margin-bottom: 8px; }
        .stat-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        
        .stat-item.large {
            grid-column: 1 / -1;
            align-items: flex-end;
            text-align: right;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 32px;
            margin-bottom: -8px;
        }
        .stat-item.large .stat-val { font-size: 48px; }

    </style>
</head>
<body class="full-screen">

    <!-- Top Navigation -->
    <div class="top-bar">
        <div class="logo">SKY<span class="ra">RA</span></div>
        <button class="day-night-toggle" onclick="toggleMode()" title="Toggle Day/Night Mode">
            <i data-lucide="moon" id="mode-icon"></i>
        </button>
    </div>

    <!-- Scene -->
    <div class="scene">
        <!-- Clouds Layer (Behind) -->
        <div class="cloud-layer">
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
        </div>

        <!-- Aircraft -->
        <div class="plane-container">
            <!-- Front facing plane SVG -->
            <svg width="600" height="250" viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="fuselage" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="50%" stop-color="#e2e8f0"/>
                        <stop offset="100%" stop-color="#94a3b8"/>
                    </linearGradient>
                    <linearGradient id="engine" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#cbd5e1"/>
                        <stop offset="100%" stop-color="#475569"/>
                    </linearGradient>
                    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#0f172a"/>
                        <stop offset="100%" stop-color="#3b82f6"/>
                    </linearGradient>
                </defs>
                
                <!-- Wings -->
                <path d="M 300 120 L 50 180 L 30 190 L 300 140 Z" fill="#e2e8f0" stroke="#94a3b8"/>
                <path d="M 300 120 L 550 180 L 570 190 L 300 140 Z" fill="#e2e8f0" stroke="#94a3b8"/>
                
                <!-- Engines -->
                <ellipse cx="180" cy="170" rx="15" ry="22" fill="url(#engine)" />
                <circle cx="180" cy="170" r="10" fill="#1e293b" />
                
                <ellipse cx="420" cy="170" rx="15" ry="22" fill="url(#engine)" />
                <circle cx="420" cy="170" r="10" fill="#1e293b" />

                <!-- Fuselage -->
                <ellipse cx="300" cy="110" rx="45" ry="55" fill="url(#fuselage)" stroke="#cbd5e1" />
                
                <!-- Cockpit Window -->
                <path d="M 270 95 Q 300 80 330 95 Q 320 110 300 110 Q 280 110 270 95 Z" fill="url(#glass)" />
                
                <!-- Tail (Visible slightly behind) -->
                <path d="M 295 40 L 300 10 L 305 40 Z" fill="#cbd5e1" />
            </svg>
        </div>

        <!-- Clouds Layer (Foreground) -->
        <div class="cloud-layer" style="z-index: 40;">
            <div class="cloud cloud3"></div>
        </div>
    </div>

    <!-- Bottom Content -->
    <div class="content-bottom">
        <div class="hero-left">
            <div class="badge-ai">
                <i data-lucide="sparkles" style="width: 14px; height: 14px;"></i> POWERED BY AI
            </div>
            <h1 class="tagline serif">
                <i>The Sky Has Always Had Secrets.<br>Now It Talks.</i>
            </h1>
        </div>

        <div class="stats-right">
            <div>
                <div class="stat-item large">
                    <span class="stat-val">0</span>
                    <span class="stat-label">Scheduling Conflicts</span>
                </div>
                <div class="stat-grid mt-4" style="margin-top: 32px;">
                    <div class="stat-item">
                        <span class="stat-val">8%</span>
                        <span class="stat-label">Fatigue Reduction</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-val">15%</span>
                        <span class="stat-label">Fewer Delays</span>
                    </div>
                </div>
            </div>
            
            <a href="login.html" class="pill-btn">
                ENTER <i data-lucide="arrow-right" style="width: 16px;"></i>
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        let isNight = false;
        function toggleMode() {
            isNight = !isNight;
            if(isNight) {
                document.body.classList.add('night-mode');
                document.getElementById('mode-icon').setAttribute('data-lucide', 'sun');
            } else {
                document.body.classList.remove('night-mode');
                document.getElementById('mode-icon').setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
