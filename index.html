<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SKYRA - The Sky Talks</title>
  <link rel="stylesheet" href="shared.css"/>
  <link rel="stylesheet" href="index.css"/>
</head>
<body>

  <!-- Full screen background video -->
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="bg-video.mp4" type="video/mp4"/>
  </video>
  <!-- Dark overlay -->
  <div class="video-overlay"></div>

  <!-- Logo top left -->
  <div class="land-logo">
    <div class="land-arrows-top">&raquo;&raquo;&raquo;</div>
    <div class="land-brand">SKY<span>RA</span></div>
  </div>

  <!-- Two cards at bottom -->
  <div class="land-grid">
    <div class="land-card">
      <div class="land-card-label">About Skyra</div>
      <h2>Aviation,<br/>Reimagined.</h2>
      <p>The first unified platform for passengers, crew, and ground staff — giving everyone the intelligence aviation never shared.</p>
    </div>
    <div class="land-card">
      <div class="specialty-badge">What Sets Skyra Apart</div>
      <h2 class="specialty-title">Our Specialties</h2>
      <div class="specialty-items">
        <div class="specialty-item"><div class="specialty-num">1</div>Passenger Rights AI</div>
        <div class="specialty-item"><div class="specialty-num">2</div>Real-Time Family Tracker</div>
        <div class="specialty-item"><div class="specialty-num">3</div>Pilot Fatigue Monitor</div>
      </div>
    </div>
  </div>

  <!-- Enter button -->
  <button class="land-next-btn" id="enterBtn" title="Enter Skyra">&#8594;</button>

  <script src="index.js"></script>
</body>
</html>
