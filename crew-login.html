<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SKYRA - Crew Sign In</title>
  <link rel="stylesheet" href="shared.css"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
  <div class="auth-bg"></div>
  <a href="login.html" class="auth-back">&#8592; BACK</a>
  <div class="auth-card">
    <div class="auth-logo">SKY<span>RA</span></div>
    <div class="auth-subtitle">Crew & Staff — Sign in to continue</div>

    <button class="google-btn" onclick="handleGoogleLogin('crew')">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="20"/>
      Continue with Google
    </button>

    <div class="auth-divider"><span>or sign in with email</span></div>

    <div class="auth-field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="captain@airline.com"/>
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••"/>
    </div>

    <button class="auth-submit crew" onclick="handleEmailLogin('crew')">Sign In</button>

    <div class="auth-footer">
      Don't have an account? <span onclick="window.location.href='crew-signup.html'">Create one</span>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
