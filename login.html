<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SKYRA - Login</title>
  <link rel="stylesheet" href="shared.css"/>
  <link rel="stylesheet" href="login.css"/>
</head>
<body>

  <div class="login-glow"></div>
  <a href="index.html" class="login-back">&#8592; BACK</a>

  <div class="login-inner">
    <div class="login-logo">SKY<span>RA</span></div>
    <div class="login-sub">Choose how you fly with us</div>
    <div class="login-cards">

      <div class="role-card" id="passengerCard">
        <div class="role-icon">🧳</div>
        <div class="role-title">PASSENGER</div>
        <div class="role-desc">Know your rights.<br/>Track your flight.<br/>Travel with clarity.</div>
        <div class="role-cta">CONTINUE &#8594;</div>
      </div>

      <div class="role-card" id="crewCard">
        <div class="role-icon">&#9992;&#65039;</div>
        <div class="role-title">CREW &amp; STAFF</div>
        <div class="role-desc">Monitor fatigue.<br/>Analyze voice stress.<br/>Fly with confidence.</div>
        <div class="role-cta">CONTINUE &#8594;</div>
      </div>

    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
